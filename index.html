<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio - Lyam Passé-Coutrin</title>
<meta name="description" content="Portfolio de Lyam Passé-Coutrin, étudiant en BUT MMI : vidéo, design et développement web.">
<meta name="theme-color" content="#0E0E10">
<link rel="icon" type="image/png" href="asset/img/logo_LPC.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Courier+Prime&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ================================================ */
/* BASE                                             */
/* ================================================ */
:root {
  --bg: #0E0E10;
  --surface: #151518;
  --surface-2: #1B1B1F;
  --line: rgba(255,255,255,.09);
  --line-strong: rgba(255,255,255,.22);
  --text: #F2F0EA;
  --muted: rgba(242,240,234,.62);
  --accent: #B6FF3B;
  --rec: #FF3B30;
  --radius: 16px;
  --f-display: 'Bebas Neue', sans-serif;
  --f-body: 'Poppins', sans-serif;
  --f-mono: 'Courier Prime', monospace;
  --pad: clamp(20px, 4vw, 48px);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { background: var(--bg); scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  background: transparent;
  color: var(--text);
  font-family: var(--f-body);
  font-weight: 300;
  line-height: 1.6;
  overflow-x: hidden;
}
img { max-width: 100%; display: block; }
a { color: inherit; }
h1, h2, h3 { font-weight: 400; }
[hidden] { display: none !important; }
::selection { background: var(--text); color: var(--bg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

#grid-bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

.wrap { max-width: 1280px; margin-inline: auto; padding-inline: var(--pad); }
.section { padding-block: clamp(70px, 10vw, 140px); }
.mono {
  font-family: var(--f-mono);
  font-size: .8rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
}
.kicker { font-family: var(--f-mono); font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
.titre { font-family: var(--f-display); font-size: clamp(3.2rem, 9vw, 8rem); line-height: .95; letter-spacing: .01em; margin-bottom: clamp(32px, 5vw, 56px); }

.btn {
  display: inline-block;
  padding: 12px 26px;
  border-radius: 50px;
  text-decoration: none;
  font-weight: 500;
  font-size: .95rem;
  transition: transform .2s, background .3s, color .3s;
}
.btn:hover { transform: translateY(-3px); }
.btn-primary { background: var(--text); color: var(--bg); }
.btn-primary:hover { background: #fff; }
.btn-ghost { border: 1px solid var(--line-strong); color: var(--text); }
.btn-ghost:hover { background: rgba(255,255,255,.08); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 30px; }
.auto-grid { display: grid; gap: 20px; }

/* apparition au scroll */
.reveal { opacity: 0; transform: translateY(26px); transition: opacity .8s ease, transform .8s ease; }
.reveal.in { opacity: 1; transform: none; }

/* ================================================ */
/* HERO                                             */
/* ================================================ */
.hero { min-height: 100svh; display: flex; flex-direction: column; padding: 28px var(--pad) 32px; }
.hero-top, .hero-bottom { display: flex; justify-content: space-between; align-items: center; gap: 24px; }
.hero-nav { display: flex; gap: 28px; }
.hero-nav a { text-decoration: none; transition: color .25s; }
.hero-nav a:hover { color: var(--text); }
.rec b { font-weight: 400; color: var(--text); }
.rec i, .status i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; animation: blink 1.4s infinite; }
.rec i { background: var(--rec); }
@keyframes blink { 50% { opacity: .25; } }

.hero-main {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(300px, 30%);
  gap: 48px;
  padding: 32px 0;
  min-height: 0;
}
.hero-name {
  align-self: center;
  font-family: var(--f-display);
  font-size: clamp(52px, 11vw, 210px);
  line-height: .88;
  letter-spacing: .01em;
}
.hero-side { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.hero-frame {
  position: relative;
  flex: 1;
  min-height: 240px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface);
}
.hero-frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.frame-label { position: absolute; top: 14px; left: 16px; font-family: var(--f-mono); font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.75); }
.status {
  align-self: flex-end;
  font-family: var(--f-mono);
  font-size: 1.1rem;                /* taille du texte "Recherche une alternance" */
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text);
}
.status i { width: 11px; height: 11px; background: var(--accent); }

.hero-bottom { padding-top: 20px; border-top: 1px solid var(--line); align-items: flex-end; }
.hero-role { font-size: clamp(1rem, 1.8vw, 1.4rem); line-height: 1.4; color: var(--text); }
.hero-scroll {
  text-decoration: none;
  border: 1px solid var(--line-strong);
  padding: 8px 18px;
  border-radius: 50px;
  color: var(--text);
  transition: background .3s, color .3s;
}
.hero-scroll:hover { background: var(--text); color: var(--bg); }

/* ================================================ */
/* PROFIL                                           */
/* ================================================ */
.profil-grid { display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 1fr); gap: clamp(32px, 6vw, 90px); align-items: center; }
.orbit { position: relative; width: 100%; aspect-ratio: 1; }
.photo {
  position: absolute; inset: 18.5%;
  border-radius: 50%; overflow: hidden;
  background: var(--surface-2);
  border: 1px solid var(--line-strong);
  box-shadow: 0 10px 40px rgba(0,0,0,.45);
}
.photo img { width: 100%; height: 100%; object-fit: cover; }
.ico {
  position: absolute; width: 12%; height: auto;
  transform: translate(-50%, -50%) rotate(var(--r, 0deg)) scale(var(--s, 1));
  filter: drop-shadow(0 5px 6px rgba(0,0,0,.5));
  transition: transform .3s ease;
}
.ico:hover { --s: 1.15; z-index: 5; }
.profil-texte p { font-size: 1.05rem; line-height: 1.85; margin-bottom: 1.3em; color: rgba(242,240,234,.85); }

/* ================================================ */
/* ALTERNANCE                                       */
/* ================================================ */
.alt-wrap { padding-bottom: clamp(70px, 10vw, 140px); }
.alt {
  max-width: 920px; margin-inline: auto; text-align: center;
  padding: clamp(28px, 5vw, 52px);
  background: linear-gradient(135deg, var(--surface-2), var(--surface));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
}
.alt h2 { font-family: var(--f-display); font-size: clamp(2rem, 4.2vw, 3.2rem); line-height: 1.05; letter-spacing: .01em; margin-bottom: 14px; }
.alt p { color: rgba(242,240,234,.85); }
.alt-details { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 32px; margin: 22px 0; font-size: .95rem; color: var(--muted); }
.alt-details strong { color: var(--text); font-weight: 500; }
.alt-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; margin-top: 26px; }

/* ================================================ */
/* PROJETS (BENTO)                                  */
/* ================================================ */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 220px; grid-auto-flow: dense; gap: 12px; }
.taille-grande { grid-column: span 2; grid-row: span 2; }
.taille-large  { grid-column: span 2; }

.card {
  position: relative; display: block; isolation: isolate;
  border-radius: 14px; overflow: hidden;
  background: var(--surface) center / cover no-repeat;
  text-decoration: none; cursor: pointer;
  transition: transform .35s cubic-bezier(.25,.46,.45,.94), box-shadow .35s ease;
}
.card:hover { transform: scale(1.025); box-shadow: 0 20px 50px rgba(0,0,0,.5); }
.card-shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.88) 0%, rgba(0,0,0,.3) 45%, transparent 100%); transition: background .3s; }
.card:hover .card-shade { background: linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.45) 55%, rgba(0,0,0,.1) 100%); }
.card-body { position: absolute; left: 0; right: 0; bottom: 0; padding: 20px 22px 22px; transform: translateY(4px); transition: transform .3s; }
.card:hover .card-body { transform: none; }
.card h3 { font-family: var(--f-display); font-size: clamp(1.5rem, 2.5vw, 2.1rem); line-height: 1.05; letter-spacing: .02em; margin-bottom: 5px; color: #fff; }
.card.taille-grande h3 { font-size: clamp(2rem, 3.5vw, 3rem); }
.card.taille-large h3 { font-size: clamp(1.8rem, 3vw, 2.6rem); }
.card p { font-size: .72rem; line-height: 1.45; color: rgba(255,255,255,.82); }

.chip {
  display: inline-block; position: relative; overflow: hidden;
  font-size: .62rem; font-weight: 500; letter-spacing: .08em;
  padding: 4px 12px; border-radius: 100px; margin-bottom: 8px;
  color: rgba(255,255,255,.95); white-space: nowrap;
  background: linear-gradient(135deg, rgba(255,255,255,.22), rgba(255,255,255,.08) 50%, rgba(255,255,255,.15));
  backdrop-filter: blur(12px) saturate(180%); -webkit-backdrop-filter: blur(12px) saturate(180%);
  border: 1px solid rgba(255,255,255,.45);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.5), inset 0 -1px 0 rgba(255,255,255,.1), 0 4px 16px rgba(0,0,0,.25);
}
.chip::before { content: ""; position: absolute; top: 0; left: 10%; right: 10%; height: 45%; background: linear-gradient(rgba(255,255,255,.35), transparent); border-radius: 100px 100px 50% 50%; pointer-events: none; }

/* ================================================ */
/* AVIS / COMPÉTENCES / CV / CONTACT                */
/* ================================================ */
.avis-grid { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.avis-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
.avis h3 { font-family: var(--f-display); font-size: 1.9rem; letter-spacing: .02em; line-height: 1.1; }
.avis .stars { height: 46px; width: auto; }
.avis .quote { width: 28px; opacity: .9; }
.avis .quote.open { margin-bottom: 10px; }
.avis .quote.close { margin: 12px 0 0 auto; transform: rotate(180deg); }
.avis p { font-size: .92rem; line-height: 1.75; color: rgba(242,240,234,.85); }

.skills-grid { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.skills h3 { font-family: var(--f-display); font-size: 2.2rem; letter-spacing: .02em; line-height: 1.05; }
.skills .sous { display: block; color: var(--muted); margin: 4px 0 22px; font-size: .92rem; }
.tags { display: flex; flex-wrap: wrap; gap: 10px; }
.tag {
  padding: 8px 22px; border-radius: 50px; font-size: .9rem; font-weight: 400;
  border: 1px solid var(--line-strong); color: var(--text);
  transition: background .3s, color .3s, transform .2s; cursor: default;
}
.tag:hover { background: var(--text); color: var(--bg); transform: scale(1.05); }

.cv { display: grid; grid-template-columns: 2fr 3fr; padding: 0; overflow: hidden; }
.cv-texte { padding: clamp(26px, 4vw, 52px); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 18px; }
.cv-texte h3 { font-family: var(--f-display); font-size: clamp(2rem, 3.4vw, 2.8rem); line-height: 1.05; letter-spacing: .02em; }
.cv-texte p { color: rgba(242,240,234,.85); }
.cv-apercu { background: var(--surface-2); padding: 24px; display: flex; justify-content: center; align-items: center; height: 520px; }
.cv-apercu img { height: 100%; width: auto; object-fit: contain; box-shadow: 0 8px 30px rgba(0,0,0,.5); }

.contact-grid { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.contact-card {
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  padding: 44px 30px; text-decoration: none; transition: transform .25s, border-color .25s, background .25s;
}
.contact-card:hover { transform: translateY(-4px); border-color: var(--line-strong); background: var(--surface-2); }
.contact-card img { width: 56px; height: auto; margin-bottom: 16px; }
.contact-card h3 { font-family: var(--f-display); font-size: 2rem; letter-spacing: .02em; }
.contact-card p { color: var(--muted); word-break: break-word; }

.footer { text-align: center; padding: 40px 20px 50px; border-top: 1px solid var(--line); }

/* ================================================ */
/* PAGE PROJET                                      */
/* ================================================ */
.projet { padding-top: 28px; padding-bottom: 100px; }
.back { display: inline-block; margin-bottom: 40px; text-decoration: none; transition: color .25s; }
.back:hover { color: var(--text); }
.pill { display: inline-block; font-family: var(--f-mono); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; padding: 6px 16px; border: 1px solid var(--line-strong); border-radius: 50px; margin-bottom: 20px; }
.p-titre { font-family: var(--f-display); font-size: clamp(3rem, 9vw, 7.5rem); line-height: .95; letter-spacing: .01em; margin-bottom: 36px; }
.p-cover { width: 100%; max-height: 520px; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--line); }
.p-info { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 64px); margin: 48px 0 64px; }
.p-info h3 { font-family: var(--f-mono); font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.p-info h3:not(:first-child) { margin-top: 30px; }
.p-info p { font-size: 1.02rem; line-height: 1.85; color: rgba(242,240,234,.88); }
.p-info .btn { margin-top: 30px; }
.tools { display: flex; flex-wrap: wrap; gap: 16px; }
.tool { width: 52px; height: auto; filter: drop-shadow(0 4px 6px rgba(0,0,0,.45)); }
.vide { padding: 30px; border: 1px solid var(--line); border-radius: var(--radius); }

.p-next { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-top: 80px; padding: 30px 0; border-top: 1px solid var(--line); text-decoration: none; }
.p-next strong { font-family: var(--f-display); font-weight: 400; font-size: clamp(2rem, 5vw, 3.6rem); line-height: 1; letter-spacing: .01em; transition: transform .3s; display: inline-block; }
.p-next:hover strong { transform: translateX(10px); }

/* ---- Carrousel ---- */
.c-viewport { position: relative; overflow: hidden; aspect-ratio: 16 / 9; border-radius: var(--radius); border: 1px solid var(--line); background: #0b0b0d; touch-action: pan-y; }
.c-track { display: flex; height: 100%; transition: transform .55s cubic-bezier(.25,.46,.45,.94); }
.c-slide { flex: 0 0 100%; min-width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
.c-slide img, .c-slide video { width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }
.c-slide iframe { width: 100%; height: auto; aspect-ratio: 16 / 9; border: 0; }
.c-btn {
  position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
  width: 48px; height: 48px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,.3); background: rgba(14,14,16,.6);
  backdrop-filter: blur(8px); color: #fff; font-size: 1.2rem; cursor: pointer;
  transition: background .3s, color .3s;
}
.c-btn:hover { background: var(--text); color: var(--bg); }
.c-prev { left: 16px; } .c-next { right: 16px; }
.c-footer { display: flex; justify-content: space-between; gap: 20px; margin-top: 14px; }
.c-dots { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
.c-dot { width: 8px; height: 8px; border-radius: 50px; border: 0; background: rgba(255,255,255,.25); cursor: pointer; transition: width .3s, background .3s; }
.c-dot.active { width: 28px; background: var(--text); }
.carousel.single .c-btn, .carousel.single .c-dots { display: none; }

/* ================================================ */
/* RESPONSIVE                                       */
/* ================================================ */
@media (max-width: 1024px) {
  .cv-apercu { height: 440px; }
}
@media (max-width: 900px) {
  .hero-nav { display: none; }
  .hero-main { grid-template-columns: 1fr; gap: 28px; padding: 28px 0; }
  .hero-name { font-size: clamp(52px, 15vw, 130px); }
  .hero-frame { flex: none; aspect-ratio: 16 / 10; min-height: 0; }
  .hero-bottom { flex-wrap: wrap; }
  .hero-role { flex-basis: 100%; }

  .profil-grid { grid-template-columns: 1fr; }
  .orbit { max-width: 480px; margin-inline: auto; }

  .grid { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 200px; }
  .cv { grid-template-columns: 1fr; }
  .cv-apercu { height: 400px; }
  .p-info { grid-template-columns: 1fr; }
}
@media (max-width: 800px) {
  .c-viewport { aspect-ratio: 4 / 3; }
  .c-btn { width: 38px; height: 38px; }
  .c-prev { left: 8px; } .c-next { right: 8px; }
}
@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr; grid-auto-rows: 220px; gap: 10px; }
  .taille-grande, .taille-large { grid-column: auto; grid-row: auto; }
  .panel { padding: 22px; }
  .avis-grid, .skills-grid { grid-template-columns: 1fr; }
  .alt-actions .btn { width: 100%; text-align: center; }
  .cv-apercu { height: 340px; padding: 14px; }
  .status { font-size: .95rem; }
}
@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
  * { animation: none !important; }
}
</style>
</head>

<body>
<canvas id="grid-bg" aria-hidden="true"></canvas>

<div id="site"></div>

<section id="projet-view" hidden>
  <div class="wrap projet">
    <a class="back mono" href="#mes-projets">← Retour aux projets</a>
    <div id="projet-contenu"></div>
  </div>
</section>

<noscript><p style="padding:40px;text-align:center">Ce portfolio a besoin de JavaScript pour s'afficher.</p></noscript>

<script src="contenue.js"></script>
<script>
(() => {
"use strict";

const C = CONTENU;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
const u = p => encodeURI(p);                       // chemins avec espaces / accents
const pad2 = n => String(n).padStart(2, "0");
const head = (num, kicker, titre) => `<p class="kicker">${num} — ${esc(kicker)}</p><h2 class="titre">${esc(titre)}</h2>`;

/* ================================================ */
/* SECTIONS DU SITE                                 */
/* ================================================ */
const heroHTML = () => `
<section class="hero" id="accueil">
  <div class="hero-top mono">
    <span>Portfolio ${esc(C.site.periode)}</span>
    <nav class="hero-nav" aria-label="Navigation">${C.navigation.map(n => `<a href="${esc(n.cible)}">${esc(n.label)}</a>`).join("")}</nav>
    <span class="rec"><i></i> REC <b id="hero-time">--:--:--</b></span>
  </div>

  <div class="hero-main">
    <h1 class="hero-name">${C.site.nomHero.map(esc).join("<br>")}</h1>
    <div class="hero-side">
      <div class="hero-frame">
        <video src="${u(C.hero.video)}" autoplay muted loop playsinline preload="metadata"></video>
        <span class="frame-label">${esc(C.hero.etiquetteVideo)}</span>
      </div>
      <span class="status"><i></i> ${esc(C.hero.statut)}</span>
    </div>
  </div>

  <div class="hero-bottom mono">
    <p class="hero-role" style="text-transform:none;letter-spacing:0;font-family:var(--f-body)">${C.hero.role.map(esc).join("<br>")}</p>
    <span>${esc(C.hero.lieu)}</span>
    <a class="hero-scroll" href="#profil">Défiler ↓</a>
  </div>
</section>`;

const profilHTML = () => {
  const P = C.profil;
  const icones = P.icones.map((ic, i, arr) => {
    const a = (-90 + i * 360 / arr.length) * Math.PI / 180;
    const x = 50 + 42 * Math.cos(a), y = 50 + 42 * Math.sin(a);
    return `<img class="ico" src="${u(ic.src)}" alt="${esc(ic.alt)}" style="left:${x.toFixed(2)}%;top:${y.toFixed(2)}%;--r:${i % 2 ? 8 : -8}deg">`;
  }).join("");
  return `
<section class="section" id="profil">
  <div class="wrap reveal">
    ${head("01", "Profil", C.titres.profil)}
    <div class="profil-grid">
      <div class="orbit">
        <div class="photo"><img src="${u(P.photo)}" alt="${esc(P.photoAlt)}"></div>
        ${icones}
      </div>
      <div class="profil-texte">${P.paragraphes.map(t => `<p>${esc(t)}</p>`).join("")}</div>
    </div>
  </div>
</section>`;
};

const alternanceHTML = () => {
  const A = C.alternance;
  return `
<section class="wrap alt-wrap reveal">
  <div class="alt">
    <h2>${esc(A.titre)}</h2>
    <p>${esc(A.texte)}</p>
    <div class="alt-details">${A.details.map(d => `<span><strong>${esc(d.label)} :</strong> ${esc(d.valeur)}</span>`).join("")}</div>
    <div class="alt-actions">
      <a class="btn btn-primary" href="${u(A.boutonCV.fichier)}" target="_blank" rel="noopener">${esc(A.boutonCV.texte)}</a>
      <a class="btn btn-ghost" href="${esc(A.boutonContact.lien)}">${esc(A.boutonContact.texte)}</a>
    </div>
  </div>
</section>`;
};

/* ================================================ */
/* PAGE PROJET + CARROUSEL                          */
/* ================================================ */
const carouselHTML = items => {
  const slides = items.map(g => {
    if (g.type === "embed") return `<div class="c-slide"><iframe src="${esc(g.src)}" title="${esc(g.nom)}" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>`;
    if (g.type === "video") return `<div class="c-slide"><video src="${u(g.src)}" controls playsinline preload="metadata"></video></div>`;
    return `<div class="c-slide"><img src="${u(g.src)}" alt="${esc(g.nom)}" draggable="false"></div>`;
  }).join("");
  const dots = items.map((_, i) => `<button class="c-dot" data-i="${i}" aria-label="Aller à l'élément ${i + 1}"></button>`).join("");
  return `
  <section class="carousel ${items.length < 2 ? "single" : ""}" id="carousel" aria-label="Galerie du projet">
    <div class="c-viewport">
      <div class="c-track">${slides}</div>
      <button class="c-btn c-prev" aria-label="Précédent">←</button>
      <button class="c-btn c-next" aria-label="Suivant">→</button>
    </div>
    <div class="c-footer mono"><span class="c-caption"></span><span class="c-count"></span></div>
    <div class="c-dots">${dots}</div>
  </section>`;
};

function initCarousel(root, items) {
  const track = $(".c-track", root), vp = $(".c-viewport", root);
  const slides = [...root.querySelectorAll(".c-slide")];
  const dots = [...root.querySelectorAll(".c-dot")];
  const cap = $(".c-caption", root), cnt = $(".c-count", root);
  let i = 0;

  const stop = s => {
    const v = s.querySelector("video"); if (v) v.pause();
    const f = s.querySelector("iframe"); if (f) f.src = f.src;   // coupe la vidéo YouTube
  };
  const go = n => {
    const t = slides.length, k = (n + t) % t;
    if (k !== i) stop(slides[i]);
    i = k;
    track.style.transform = `translateX(-${i * 100}%)`;
    slides.forEach((s, j) => s.toggleAttribute("inert", j !== i));
    dots.forEach((d, j) => d.classList.toggle("active", j === i));
    cap.textContent = items[i].nom;
    cnt.textContent = `${pad2(i + 1)} / ${pad2(t)}`;
  };

  $(".c-prev", root).addEventListener("click", () => go(i - 1));
  $(".c-next", root).addEventListener("click", () => go(i + 1));
  dots.forEach(d => d.addEventListener("click", () => go(+d.dataset.i)));

  let x0 = null;
  vp.addEventListener("pointerdown", e => { if (!e.target.closest("button, video, iframe")) x0 = e.clientX; });
  vp.addEventListener("pointerup", e => {
    if (x0 === null) return;
    const dx = e.clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) go(dx < 0 ? i + 1 : i - 1);
  });
  vp.addEventListener("pointercancel", () => { x0 = null; });

  go(0);
  return { prev: () => go(i - 1), next: () => go(i + 1) };
}

function projetHTML(p, idx) {

/* ================================================ */
/* ROUTAGE (#projet/slug)                           */
/* ================================================ */
const site = $("#site"), view = $("#projet-view"), box = $("#projet-contenu");
const baseTitle = document.title;
let savedY = null, activeCarousel = null;

const jump = y => {
  const h = document.documentElement;
  h.style.scrollBehavior = "auto";
  window.scrollTo(0, y);
  h.style.scrollBehavior = "";
};

function openProject(slug) {
  const idx = C.projets.findIndex(p => p.slug === slug);
  if (!site.hidden && window.scrollY > 0) savedY = window.scrollY;
  site.hidden = true;
  view.hidden = false;
  activeCarousel = null;

  if (idx < 0) {
    box.innerHTML = '<p class="vide">Projet introuvable.</p>';
    document.title = baseTitle;
  } else {
    const p = C.projets[idx];
    box.innerHTML = projetHTML(p, idx);
    document.title = `${p.titre.join(" ")} - ${C.site.nomComplet}`;
    const root = $("#carousel", box);
    if (root) activeCarousel = initCarousel(root, p.galerie);
  }
  jump(0);
}

function closeProject() {
  if (view.hidden) return;
  activeCarousel = null;
  box.innerHTML = "";                       // arrête toutes les vidéos
  view.hidden = true;
  site.hidden = false;
  document.title = baseTitle;
  if (savedY !== null) jump(savedY);
  else { const t = $("#mes-projets"); jump(t ? t.getBoundingClientRect().top + window.scrollY - 20 : 0); }
  savedY = null;
}

function route() {
  const m = location.hash.match(/^#projet\/(.+)$/);
  m ? openProject(decodeURIComponent(m[1])) : closeProject();
}

document.addEventListener("keydown", e => {
  if (view.hidden) return;
  if (e.key === "Escape") location.hash = "#mes-projets";
  else if (activeCarousel && e.key === "ArrowLeft") activeCarousel.prev();
  else if (activeCarousel && e.key === "ArrowRight") activeCarousel.next();
});

/* ================================================ */
/* RENDU + HEURE EN DIRECT + APPARITIONS            */

const clock = $("#hero-time");
const tick = () => { const d = new Date(); clock.textContent = `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; };
tick(); setInterval(tick, 1000);

const io = "IntersectionObserver" in window
  ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .1 })
  : null;
document.querySelectorAll(".reveal").forEach(el => io ? io.observe(el) : el.classList.add("in"));

window.addEventListener("hashchange", route);

/* ================================================ */
/* FOND GRILLE INTERACTIF (effet lentille)          */
/* ================================================ */
(() => {
  const canvas = $("#grid-bg");
  const ctx = canvas.getContext("2d");

  // ---------- RÉGLAGES ----------
  const CELL = 44;      // taille d'une case (28 = fin, 60 = aéré)
  const STEP = 8;       // finesse des courbes
  const RADIUS = 260;   // taille de la lentille
  const BULGE = 0.9;    // force du bombé (0.5 doux, 1.2 fort)
  const CROSS = 3.5;    // taille des croix aux intersections (0 = aucune)
  const EASE = 0.1;     // douceur de suivi de la souris
  const BASE_LINE = "rgba(255,255,255,0.06)";
  const HI_RGB = "255,255,255";
  const HI_ALPHA = 0.45;

  let w, h, still = false;
  const m = { x: -9999, y: -9999, tx: -9999, ty: -9999, a: 0, ta: 0, init: false };

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    still = false;
  }
  window.addEventListener("resize", resize);
  resize();

  window.addEventListener("pointermove", e => {
    m.tx = e.clientX; m.ty = e.clientY; m.ta = 1;
    if (!m.init) { m.x = m.tx; m.y = m.ty; m.init = true; }
  });
  document.documentElement.addEventListener("pointerleave", () => { m.ta = 0; });

  const warp = (x, y) => {
    const dx = x - m.x, dy = y - m.y, d = Math.hypot(dx, dy);
    if (d >= RADIUS || d === 0) return [x, y];
    const t = 1 - d / RADIUS, s = 1 + BULGE * m.a * t * t;
    return [m.x + dx * s, m.y + dy * s];
  };

  function draw() {
    ctx.clearRect(0, 0, w, h);
    ctx.lineWidth = 1;
    ctx.strokeStyle = BASE_LINE;
    ctx.beginPath();
    for (let y = 0; y <= h + CELL; y += CELL)
      for (let x = 0; x <= w + STEP; x += STEP) { const [px, py] = warp(x, y); x === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py); }
    for (let x = 0; x <= w + CELL; x += CELL)
      for (let y = 0; y <= h + STEP; y += STEP) { const [px, py] = warp(x, y); y === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py); }
    if (CROSS > 0)
      for (let y = 0; y <= h + CELL; y += CELL)
        for (let x = 0; x <= w + CELL; x += CELL) {
          const [px, py] = warp(x, y);
          ctx.moveTo(px - CROSS, py); ctx.lineTo(px + CROSS, py);
          ctx.moveTo(px, py - CROSS); ctx.lineTo(px, py + CROSS);
        }
    ctx.stroke();

    if (m.a > 0.01) {
      const seg = (x0, y0, x1, y1) => {
        const d = Math.hypot((x0 + x1) / 2 - m.x, (y0 + y1) / 2 - m.y), t = 1 - d / RADIUS;
        if (t <= 0) return;
        ctx.strokeStyle = `rgba(${HI_RGB},${(t * t * HI_ALPHA * m.a).toFixed(3)})`;
        const [ax, ay] = warp(x0, y0), [bx, by] = warp(x1, y1);
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
      };
      const sx = Math.floor((m.x - RADIUS) / STEP) * STEP, sy = Math.floor((m.y - RADIUS) / STEP) * STEP;
      const gx = Math.floor((m.x - RADIUS) / CELL) * CELL, gy = Math.floor((m.y - RADIUS) / CELL) * CELL;
      for (let y = gy; y <= m.y + RADIUS; y += CELL) for (let x = sx; x < m.x + RADIUS; x += STEP) seg(x, y, x + STEP, y);
      for (let x = gx; x <= m.x + RADIUS; x += CELL) for (let y = sy; y < m.y + RADIUS; y += STEP) seg(x, y, x, y + STEP);
    }
  }

  function frame() {
    m.x += (m.tx - m.x) * EASE;
    m.y += (m.ty - m.y) * EASE;
    m.a += (m.ta - m.a) * 0.08;
    const idle = m.ta === 0 && m.a < 0.002;
    if (!(idle && still)) { draw(); still = idle; }   // ne redessine pas quand rien ne bouge
    requestAnimationFrame(frame);
  }
  frame();
})();

})();
